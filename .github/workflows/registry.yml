name: registry
on:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate mod.json & generate registry
        run: node tools/gen-mod-registry.mjs --out registry.json --extra extra/calamity.json
      - name: Upload registry artifact
        uses: actions/upload-artifact@v4
        with:
          name: registry
          path: registry.json
